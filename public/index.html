<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Abner's Quiz Site</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/auth.css">
    <script src="/app.js" defer></script>
    <script src="/auth.js" defer></script>
  </head>
  <body>
    <main>
      <nav id="auth-nav" class="auth-nav" aria-label="Account"></nav>
      <h1>Abner's Quiz Site</h1>
      <p>This is the working title. We'll change this later.</p>

      <form id="name-form">
        <label for="name-input">Write a message to save to the database</label>
        <input id="name-input" name="text" type="text" maxlength="200" placeholder="Hello, database!" required />
        <button type="submit">Save to the database</button>
      </form>
      <p id="response"></p>
    </main>
  </body>
</html>
