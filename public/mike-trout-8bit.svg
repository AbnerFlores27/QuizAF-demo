<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <title>Mike Trout 8-bit</title>
  <desc>8-bit style Mike Trout in Angels uniform</desc>
  
  <!-- Head and Helmet -->
  <rect x="44" y="0" width="40" height="8" fill="#003366"/>
  <rect x="40" y="4" width="48" height="8" fill="#003366"/>
  <rect x="44" y="8" width="40" height="8" fill="#C0C0C0"/>
  <rect x="48" y="12" width="32" height="4" fill="#003366"/>
  
  <!-- Face -->
  <rect x="52" y="16" width="24" height="12" fill="#FFDAB9"/>
  <rect x="56" y="20" width="4" height="2" fill="#000"/>
  <rect x="64" y="20" width="4" height="2" fill="#000"/>
  <rect x="60" y="24" width="8" height="2" fill="#000"/>
  
  <!-- Jersey - Angels Red -->
  <rect x="32" y="28" width="64" height="24" fill="#C60C30"/>
  <rect x="32" y="28" width="64" height="4" fill="#003366"/>
  <rect x="32" y="48" width="64" height="4" fill="#003366"/>
  
  <!-- Number 27 -->
  <rect x="44" y="32" width="8" height="12" fill="#FFFFFF"/>
  <rect x="56" y="32" width="8" height="4" fill="#FFFFFF"/>
  <rect x="56" y="36" width="8" height="8" fill="#FFFFFF"/>
  
  <!-- Arms -->
  <rect x="16" y="32" width="16" height="20" fill="#FFDAB9"/>
  <rect x="96" y="32" width="16" height="20" fill="#FFDAB9"/>
  
  <!-- Glove -->
  <rect x="8" y="44" width="12" height="12" fill="#8B4513"/>
  
  <!-- Bat -->
  <rect x="104" y="28" width="16" height="40" fill="#8B4513"/>
  
  <!-- Pants - White -->
  <rect x="36" y="52" width="56" height="28" fill="#FFFFFF"/>
  <rect x="36" y="52" width="56" height="4" fill="#003366"/>
  
  <!-- Belt -->
  <rect x="48" y="52" width="32" height="2" fill="#000"/>
  
  <!-- Cleats -->
  <rect x="40" y="80" width="12" height="8" fill="#000"/>
  <rect x="76" y="80" width="12" height="8" fill="#000"/>
  <rect x="40" y="84" width="12" height="4" fill="#FFFFFF"/>
  <rect x="76" y="84" width="12" height="4" fill="#FFFFFF"/>
  
  <!-- Socks - Red -->
  <rect x="40" y="76" width="12" height="4" fill="#C60C30"/>
  <rect x="76" y="76" width="12" height="4" fill="#C60C30"/>
</svg>