<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Log in - Abner's Quiz Site</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/auth.css">
    <script src="/auth.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to keep your quiz progress.</p>
        <form id="login-form">
          <label for="identifier">Username or email</label>
          <input id="identifier" name="identifier" type="text" maxlength="255" autocomplete="username" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" maxlength="200" autocomplete="current-password" required>
          <button type="submit">Log in</button>
          <p id="auth-message" class="auth-message" role="alert" aria-live="polite"></p>
        </form>
        <p class="auth-alt">New here? <a href="/register.html">Create an account</a></p>
      </section>
    </main>
  </body>
</html>
