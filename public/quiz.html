<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17243a">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Quiz App - Abner's Quiz Site</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1 style="color: #17243a;">Quiz App</h1>
        <p class="birthday" style="color: #FF6B6B;">Test Your Knowledge!</p>
      </header>

      <section id="quiz-section" class="quiz-card">
        <div class="card-heading">
          <p class="eyebrow">Quiz</p>
          <h2>Question <span id="question-number">1</span> of <span id="total-questions">10</span></h2>
        </div>
        
        <div id="quiz-content">
          <h3 id="question-text" class="question-text">Loading question...</h3>
          <div id="options-container" class="options-container"></div>
        </div>

        <div class="quiz-controls">
          <button id="prev-btn" class="btn-secondary" disabled>Previous</button>
          <button id="next-btn" class="btn-primary">Next</button>
          <button id="submit-btn" class="btn-success" style="display: none;">Submit Quiz</button>
        </div>

        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      </section>

      <section id="results-section" class="results-card" style="display: none;">
        <div class="card-heading">
          <p class="eyebrow">Results</p>
          <h2>Quiz Completed!</h2>
        </div>
        
        <div class="results-summary">
          <p>You scored <span id="score-display">0</span> out of <span id="total-display">10</span>!</p>
          <p id="percentage-display" class="percentage"></p>
        </div>

        <div class="results-details" id="results-details"></div>

        <div class="results-actions">
          <button id="restart-btn" class="btn-primary">Take Quiz Again</button>
          <button id="view-leaderboard-btn" class="btn-secondary">View Leaderboard</button>
        </div>
      </section>

      <section id="leaderboard-section" class="leaderboard-card" style="display: none;">
        <div class="card-heading">
          <p class="eyebrow">Leaderboard</p>
          <h2>Top Scores</h2>
        </div>
        
        <div class="leaderboard-header">
          <form id="leaderboard-form" class="name-form">
            <label for="player-name">Enter your name for the leaderboard:</label>
            <div class="form-row">
              <input
                id="player-name"
                name="playerName"
                type="text"
                maxlength="50"
                placeholder="Your Name"
                required
              >
              <button type="submit" class="btn-primary">Save Score</button>
            </div>
          </form>
        </div>

        <div id="leaderboard-container" class="leaderboard-container">
          <div class="leaderboard-table-header">
            <span class="rank-col">Rank</span>
            <span class="name-col">Name</span>
            <span class="score-col">Score</span>
            <span class="date-col">Date</span>
          </div>
          <div id="leaderboard-entries" class="leaderboard-entries"></div>
        </div>

        <button id="back-to-quiz-btn" class="btn-secondary" style="margin-top: 20px;">Back to Quiz</button>
      </section>

      <section id="setup-section" class="setup-card">
        <div class="card-heading">
          <p class="eyebrow">Setup</p>
          <h2>Initialize Quiz Database</h2>
        </div>
        
        <div class="setup-actions">
          <button id="init-db-btn" class="btn-primary">Initialize Database</button>
          <button id="load-sample-btn" class="btn-secondary">Load Sample Questions</button>
        </div>
        
        <pre id="setup-result" class="result" role="status" aria-live="polite">Ready to initialize.</pre>
      </section>

      <footer>
        <p>Quiz App with Express, PostgreSQL, and Replit</p>
      </footer>
    </main>
  </body>
</html>
