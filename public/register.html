<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - California Sports Quiz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/">California Sports Quiz</a>
    <div>
      <a href="/quizzes.html">Quizzes</a>
      <a href="/history.html">My history</a>
      <span id="nav-auth">Loading...</span>
    </div>
  </nav>
  <main>
    <div class="card">
      <h1>Create an account</h1>
      <p id="error" class="error hidden"></p>
      <form id="register-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password (8+ characters)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
        <button type="submit">Register</button>
      </form>
      <p>Already have an account? <a href="/login.html">Log in here.</a></p>
    </div>
  </main>
  <script src="/app.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", function (event) {
      event.preventDefault();
      var errorBox = document.getElementById("error");
      errorBox.classList.add("hidden");
      var password = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;
      if (password !== confirm) {
        errorBox.textContent = "The two passwords do not match.";
        errorBox.classList.remove("hidden");
        return;
      }
      fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          email: document.getElementById("email").value,
          password: password,
        }),
      })
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .then(function (result) {
          if (!result.ok) {
            errorBox.textContent = result.data.error || "Could not register.";
            errorBox.classList.remove("hidden");
            return;
          }
          window.location.href = "/";
        });
    });
  </script>
</body>
</html>
